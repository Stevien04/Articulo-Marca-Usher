# render.yaml - Configuración de despliegue en Render
# Documentación: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: articulo-marca-usher
    runtime: node
    region: oregon
    plan: free
    rootDir: app
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeployTrigger: off # GitHub Actions activa el Deploy Hook tras los controles
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        sync: false   # Se configura manualmente en el dashboard de Render
