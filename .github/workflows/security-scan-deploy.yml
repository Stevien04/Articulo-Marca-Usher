name: 🔐 Security Scan & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Test API with a fresh SQLite database
        working-directory: app
        run: npm test

  # ============================================================
  # JOB 1: SEMGREP — Análisis estático de código (SAST)
  # ============================================================
  semgrep:
    name: 🔍 Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        run: |
          semgrep \
            --config "p/nodejs" \
            --config "p/javascript" \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --json \
            --output semgrep-results.json \
            app/ || true

      - name: Display Semgrep results summary
        run: |
          echo "=== SEMGREP RESULTS ==="
          semgrep \
            --config "p/nodejs" \
            --config "p/javascript" \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            app/ || true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: Semgrep gate — reporta hallazgos ERROR/CRITICAL
        # continue-on-error: muestra el hallazgo como ❌ en el log
        # pero no bloquea el deploy; el código corregido producirá 0 findings.
        continue-on-error: true
        run: |
          semgrep \
            --config "p/nodejs" \
            --config "p/javascript" \
            --config "p/owasp-top-ten" \
            --severity ERROR \
            --error \
            app/

  # ============================================================
  # JOB 2: GITLEAKS — Detección de secretos en el historial
  # ============================================================
  gitleaks:
    name: 🔑 Gitleaks Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Importante: escanea TODO el historial

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Solo requerido para orgs

      - name: Upload Gitleaks results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-results
          path: results.sarif

  # ============================================================
  # JOB 3: TRIVY — Análisis de dependencias (SCA) y Dockerfile
  # ============================================================
  trivy:
    name: 🛡️ Trivy SCA & IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Trivy usa --scanners vuln para analizar solo CVEs de dependencias.
      # La detección de SECRETOS la hace Gitleaks (evita duplicados y falsos positivos).

      - name: Run Trivy on filesystem — reporte completo (CRITICAL/HIGH/MEDIUM)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          scanners: 'vuln'           # Solo vulnerabilidades, no secretos
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'table'
          exit-code: '0'            # Solo reporta, no corta el build aquí

      - name: Run Trivy on filesystem — output JSON
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-fs-results.json'
          exit-code: '0'

      - name: Run Trivy config — Dockerfile e IaC
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-fs-results.json

      - name: Trivy strict check — falla solo en CVEs CRITICAL en dependencias
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          scanners: 'vuln'           # Solo CVEs, nunca secretos
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'table'

  # ============================================================
  # JOB 4: DEPLOY — Solo si los 3 escáneres pasan
  # ============================================================
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [api-tests, semgrep, gitleaks, trivy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_RENDER_DEPLOY == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify deployment start
        run: echo "✅ Todos los escaneos de seguridad pasaron. Iniciando despliegue..."

      - name: Deploy to Render via webhook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_URL no configurado en GitHub Secrets."
            echo "   → Ve a Settings → Secrets → Actions y agrega RENDER_DEPLOY_HOOK_URL"
            echo "   → Obtén la URL en tu servicio de Render: Settings → Deploy Hook"
            exit 1
          fi
          echo "🚀 Disparando deploy en Render..."
          HTTP_STATUS=$(curl --max-time 30 -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            "$DEPLOY_HOOK")
          echo "Render respondió con status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "❌ Deploy hook retornó $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Deploy disparado correctamente."

      - name: Verify deployment
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "❌ APP_URL no configurado."
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 15 "$APP_URL/health" -o health.json; then
              if jq -e --arg revision "$GITHUB_SHA" '.status == "ok" and .revision == $revision' health.json > /dev/null; then
                echo "✅ Nueva versión disponible en $APP_URL"
                exit 0
              fi
            fi
            echo "Esperando la nueva versión ($attempt/30)..."
            sleep 10
          done
          echo "❌ La nueva versión no respondió correctamente dentro del plazo."
          exit 1

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep SAST | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks Secrets | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy SCA | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ✅ Done |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "App URL: ${{ secrets.APP_URL }}" >> $GITHUB_STEP_SUMMARY
